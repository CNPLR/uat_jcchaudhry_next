# ==========================================
# CI/CD - Deploy Live CNPL Website
# ==========================================

name: Deploy live CNPL Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v5


      # ==========================================
      # Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.13.0
          cache: npm


      # ==========================================
      # Install dependencies
      # ==========================================
      - name: Install dependencies
        run: npm ci


      # ==========================================
      # Build Next.js
      # ==========================================
      - name: Build Project
        run: npm run build


      # ==========================================
      # Verify Next.js build
      # ==========================================
      - name: Verify build
        run: |
          test -d .next
          echo "✅ Next.js build verified"


      # ==========================================
      # Copy build/application to EC2
      # ==========================================
      - name: Copy application to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          source: ".next,public,package.json,package-lock.json,next.config.ts,ecosystem.config.cjs"
          target: "/var/www/cnpl/"


      # ==========================================
      # Restart application on EC2
      # ==========================================
      - name: Restart site
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Loading Node.js"
            echo "======================================"

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "❌ NVM not found"
              exit 1
            fi

            nvm use 24.13

            echo "Node:"
            node -v

            echo "NPM:"
            npm -v

            echo "PM2:"
            pm2 --version


            echo "======================================"
            echo "Application directory"
            echo "======================================"

            cd /var/www/cnpl

            pwd


            echo "======================================"
            echo "Checking required files"
            echo "======================================"

            if [ ! -d ".next" ]; then
              echo "❌ .next directory not found"
              exit 1
            fi

            echo "✅ .next directory exists"


            if [ ! -f "package.json" ]; then
              echo "❌ package.json not found"
              exit 1
            fi

            echo "✅ package.json exists"


            if [ ! -f "package-lock.json" ]; then
              echo "❌ package-lock.json not found"
              exit 1
            fi

            echo "✅ package-lock.json exists"


            if [ ! -f "ecosystem.config.cjs" ]; then
              echo "❌ ecosystem.config.cjs not found"
              exit 1
            fi

            echo "✅ ecosystem.config.cjs exists"


            echo "======================================"
            echo "Checking production environment"
            echo "======================================"

            if [ ! -f ".env.production" ]; then
              echo "❌ .env.production not found"
              exit 1
            fi

            echo "✅ .env.production exists"


            echo "======================================"
            echo "Installing dependencies"
            echo "======================================"

            npm ci

            echo "✅ Dependencies installed"


            echo "======================================"
            echo "Checking Next.js installation"
            echo "======================================"

            npx next --version


            echo "======================================"
            echo "Starting / Restarting PM2"
            echo "======================================"

            pm2 startOrRestart ecosystem.config.cjs

            echo "✅ PM2 application started/restarted"


            echo "======================================"
            echo "Saving PM2"
            echo "======================================"

            pm2 save

            echo "✅ PM2 process list saved"


            echo "======================================"
            echo "PM2 Status"
            echo "======================================"

            pm2 status


            echo "======================================"
            echo "Application logs"
            echo "======================================"

            pm2 logs jcchaudhry --lines 20 --nostream


            echo "======================================"
            echo "Deployment completed successfully!"
            echo "======================================"